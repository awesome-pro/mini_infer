[project]
name = "miniserve"
version = "0.1.0"
description = "A miniature LLM inference runtime: continuous batching, chunked prefill, token-budget scheduling and block-based KV cache management."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.9"]
torch = ["torch>=2.6", "transformers>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["miniserve"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
